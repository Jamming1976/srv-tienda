name: Sync MercadoLibre → Firebase

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # también se puede correr a mano desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync
        env:
          ML_TOKEN:      ${{ secrets.ML_TOKEN }}
          FIREBASE_URL:  ${{ secrets.FIREBASE_URL }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
        run: python sync.py
